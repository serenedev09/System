<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MyEstia Personal Task & Reminder System</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/all.min.css') }}">

  <style>
    body,
    h1, h2, h3, h4, h5, h6,
    button, input, select, textarea {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Outfit', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 28px; height: 28px;">
            <defs>
              <linearGradient id="regBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366f1"/>
                <stop offset="50%" stop-color="#8b5cf6"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
            <circle cx="24" cy="27" r="15" stroke="url(#regBrandGrad)" stroke-width="2.5" fill="none"/>
            <line x1="24" y1="27" x2="24" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="24" y1="27" x2="30" y2="27" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="24" cy="27" r="2" fill="currentColor"/>
            <rect x="21" y="4" width="6" height="4" rx="2" fill="url(#regBrandGrad)"/>
            <rect x="22.5" y="8" width="3" height="4" fill="url(#regBrandGrad)"/>
          </svg>
        </div>
        <h2>Join MyEstia</h2>
        <p>Create your personal task and reminder account</p>
      </div>

      <form id="register-form">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label" for="reg-fullname">Full Name *</label>
          <input type="text" id="reg-fullname" class="form-input" placeholder="e.g., Alex Morgan" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label" for="reg-username">Username *</label>
          <input type="text" id="reg-username" class="form-input" placeholder="e.g., alexmorgan" required minlength="3">
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label" for="reg-email">Email Address *</label>
          <input type="email" id="reg-email" class="form-input" placeholder="alex@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" for="reg-password">Password (min 6 chars) *</label>
          <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn-primary auth-btn-block" id="btn-submit-register">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.9"/>
            <path d="M4 20C4 16.5 7.5 14 12 14C16.5 14 20 16.5 20 20" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            <path d="M19 6V10M17 8H21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg> Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="{{ url_for('login_page') }}" style="font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script>
    const form = document.getElementById('register-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('reg-fullname').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const submitBtn = document.getElementById('btn-submit-register');

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Creating Account...';

      try {
        const res = await API.auth.register(full_name, username, email, password);
        if (res.success) {
          API.showToast('Account created successfully! Welcome to MyEstia.', 'success');
          setTimeout(() => {
            window.location.href = "{{ url_for('index_page') }}";
          }, 400);
        } else {
          API.showToast(res.message || 'Registration failed', 'error');
        }
      } catch (err) {
        API.showToast(err.message || 'Error occurred during registration', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-right: 0.4rem;"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.9"/><path d="M4 20C4 16.5 7.5 14 12 14C16.5 14 20 16.5 20 20" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M19 6V10M17 8H21" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> Create Account';
      }
    });
  </script>
</body>

</html>
